name: Aztec Benchmark Diff

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  BENCH_DIR: ./benchmarks

jobs:
  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest-m
    outputs:
      should-benchmark: ${{ steps.changes.outputs.should-benchmark }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for relevant changes
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Checking for changes that would affect benchmarks...');

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            console.log('Changed files:');
            files.forEach(file => console.log(`- ${file.filename}`));

            // Check for Noir contracts, config, or benchmark changes
            const relevantPatterns = /^(src\/nr\/|Nargo\.toml|benchmarks\/)/;
            const hasRelevantChanges = files.some(file => relevantPatterns.test(file.filename));

            // Check for AZTEC_VERSION change in package.json
            const hasAztecVersionChange = files.some(file =>
              file.filename === 'package.json' && file.patch?.includes('aztecVersion')
            );

            const shouldBenchmark = hasRelevantChanges || hasAztecVersionChange;

            if (hasRelevantChanges) {
              console.log('Noir contracts, config, or benchmark files changed');
            } else if (hasAztecVersionChange) {
              console.log('AZTEC_VERSION changed in package.json');
            } else {
              console.log('No benchmark-relevant changes detected, skipping benchmarks');
            }

            core.setOutput('should-benchmark', shouldBenchmark);

  version-check:
    name: Check version compatibility
    runs-on: ubuntu-latest
    outputs:
      skip_benchmark: ${{ steps.compare.outputs.skip }}
      base_version: ${{ steps.compare.outputs.base_ver }}
      pr_version: ${{ steps.compare.outputs.pr_ver }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Get PR version
        id: pr
        run: echo "ver=$(node -p "require('./package.json').config.aztecVersion")" >> "$GITHUB_OUTPUT"

      - name: Checkout BASE
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Compare versions
        id: compare
        run: |
          BASE_VER=$(node -p "require('./package.json').config.aztecVersion")
          PR_VER="${{ steps.pr.outputs.ver }}"
          echo "base_ver=$BASE_VER" >> "$GITHUB_OUTPUT"
          echo "pr_ver=$PR_VER" >> "$GITHUB_OUTPUT"
          echo "Base version: $BASE_VER"
          echo "PR version: $PR_VER"
          if [ "$BASE_VER" != "$PR_VER" ]; then
            echo "Versions differ - benchmarks will be skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Versions match - benchmarks will run"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    needs: [check-changes, version-check]
    if: |
      needs.check-changes.outputs.should-benchmark == 'true' &&
      needs.version-check.outputs.skip_benchmark != 'true'
    strategy:
      matrix:
        os: [ubuntu-latest-m]
        threads: [12]

    runs-on:
      labels: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      # ──────────────────────────────────────────────────────────────
      # 0️⃣  SHARED TOOLING – Buildx + Aztec CLI skeleton
      # ──────────────────────────────────────────────────────────────
      - name: Checkout repo (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx (Aztec sandbox needs BuildKit)
        uses: docker/setup-buildx-action@v2

      - name: Detect Aztec version
        id: aztec-version
        run: |
          AZTEC_VERSION=$(node -p "require('./package.json').config.aztecVersion")
          echo "version=$AZTEC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Aztec version is $AZTEC_VERSION"

      - name: Install Aztec CLI
        run: |
          curl -s https://install.aztec.network > tmp.sh
          VERSION=${{ steps.aztec-version.outputs.version }} bash tmp.sh <<< yes "yes"
    
      - name: Update path
        run: echo "/home/runner/.aztec/bin" >> $GITHUB_PATH

      # ──────────────────────────────────────────────────────────────
      # 1️⃣  BENCHMARK BASE COMMIT
      # ──────────────────────────────────────────────────────────────
      - name: Checkout BASE branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Detect Aztec version (BASE)
        id: basever
        run: |
          VER=$(node -p "require('./package.json').config.aztecVersion")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Base Aztec version is $VER"

      - name: Switch CLI to BASE version
        run: |
          VERSION=${{ steps.basever.outputs.ver }} aztec-up

      - name: Start local network (BASE, background)
        run: aztec start --local-network &

      - name: Start PXE node (BASE, background)
        run: |
          VERSION=${{ steps.basever.outputs.ver }} aztec \
            start --port 8081 --pxe --pxe.nodeUrl=http://localhost:8080/ \
            --pxe.proverEnabled false &

      # This is a temporary hack to fix a problem with v3 releases.
      - name: Manually tag the aztec version as `latest`
        run: |
          docker tag aztecprotocol/aztec:${{ steps.basever.outputs.ver }} aztecprotocol/aztec:latest

      - name: Install deps (BASE)
        run: yarn --frozen-lockfile

      - name: Compile contracts (BASE)
        run: yarn compile

      - name: Codegen wrappers (BASE)
        run: yarn codegen

      - name: Build aztec-standards (BASE)
        run: yarn build-aztec-standards --force

      - name: Benchmark (BASE)
        run: |
          npx aztec-benchmark --suffix _base --output-dir ${{ env.BENCH_DIR }}

      # This is required to avoid the benchmark results being removed by the Checkout PR step
      - name: Store base benchmark results
        run: |
          mkdir -p ../benchmarks_base && mv ${{ env.BENCH_DIR }}/*.json ../benchmarks_base/

      # ──────────────────────────────────────────────────────────────
      # 2️⃣  BENCHMARK PR HEAD  (github.event.pull_request.head.sha)
      # ──────────────────────────────────────────────────────────────

      # clean does not work correctly and is removing the benchmark results anyways
      # https://github.com/actions/checkout/issues/1201
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: false

      # Restore the base benchmark results to avoid the benchmark results being removed by the Checkout PR step
      - name: Restore base benchmark results
        run: mv ../benchmarks_base/* ${{ env.BENCH_DIR }}/

      - name: Detect Aztec version (PR)
        id: prver
        run: |
          VER=$(node -p "require('./package.json').config.aztecVersion")
          echo "PR Aztec version is $VER"
          if [ "${{ steps.basever.outputs.ver }}" != "$VER" ]; then
            echo "ver_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "ver_diff=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Kill BASE services
        if: steps.prver.outputs.ver_diff == 'true'
        run: |
          pkill -f "aztec.*--local-network" || true
          pkill -f "aztec.*--pxe.*8081" || true
          sleep 5      

      - name: Switch CLI to PR version
        if: steps.prver.outputs.ver_diff == 'true'
        run: |
          VERSION=${{ steps.prver.outputs.ver }} aztec-up

      - name: Start local network (PR, background)
        if: steps.prver.outputs.ver_diff == 'true'
        run: aztec start --local-network &

      - name: Start PXE node (PR, background)
        if: steps.prver.outputs.ver_diff == 'true'
        run: |
          VERSION=${{ steps.prver.outputs.ver }} aztec \
            start --port 8081 --pxe --pxe.nodeUrl=http://localhost:8080/ \
            --pxe.proverEnabled false &

      # This is a temporary hack to fix a problem with v3 releases.
      - name: Manually tag the aztec version as `latest`
        run: |
          docker tag aztecprotocol/aztec:${{ steps.prver.outputs.ver }} aztecprotocol/aztec:latest

      - name: Install deps (PR)
        run: yarn --frozen-lockfile

      - name: Compile contracts (PR)
        run: yarn compile

      - name: Codegen wrappers (PR)
        run: yarn codegen

      - name: Build aztec-standards (PR)
        run: yarn build-aztec-standards --force

      # ──────────────────────────────────────────────────────────────
      # 3️⃣  DIFF &  COMMENT
      # ──────────────────────────────────────────────────────────────
      - name: Generate Markdown diff
        uses: defi-wonderland/aztec-benchmark/action@main
        with:
          base_suffix: '_base'
          current_suffix: '_pr'

      - name: Comment diff
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: benchmark-comparison.md

  skip-comment:
    name: Post skip notice
    needs: [check-changes, version-check]
    if: |
      needs.check-changes.outputs.should-benchmark == 'true' &&
      needs.version-check.outputs.skip_benchmark == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post skip comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Benchmark Comparison Skipped

            Benchmarks were skipped because the Aztec version changed:
            - **Base:** `${{ needs.version-check.outputs.base_version }}`
            - **PR:** `${{ needs.version-check.outputs.pr_version }}`

            This is expected during version upgrades.