name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install and cache yarn
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate commit messages
        if: github.event_name == 'push'
        run: yarn commitlint --from=${{ github.event.before }} --to=${{ github.sha }} --verbose

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.title }}" | yarn commitlint --verbose

  format-check:
    name: Check Files Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Aztec environment
        id: setup-aztec
        uses: defi-wonderland/aztec-ci-actions/actions/setup-aztec@feat/next
        with:
          run-compile: 'false'

      - name: Check Noir formatting
        run: nargo fmt --check

      - name: Check Javascript & Typescript formatting
        run: yarn prettier '**/*.{js,ts}' --check
